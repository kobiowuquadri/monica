# Render Blueprint for the MONICA API (Express). Secrets are entered in the Render dashboard
# (sync: false) and are never committed. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: monica-api
    runtime: node
    rootDir: backend
    plan: free
    region: ohio            # close to Neon us-east-2
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"         # browser → Render load balancer → app (the frontend calls the API directly)
      - key: COOKIE_SAMESITE
        value: none           # frontend (vercel.app) and API (onrender.com) are different sites
      - key: ALLOWED_ORIGINS
        value: https://monica-phi-one.vercel.app
      - key: DEMO_RETENTION_HOURS
        value: "24"
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: NASA_API_KEY
        sync: false
